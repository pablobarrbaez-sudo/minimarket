<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket POS - Bienvenido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 60%, #020617 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin: 0;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-box {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
            padding: 3.25rem 2.5rem;
            max-width: 460px;
            width: 100%;
            animation: fadeSlideUp 0.35s ease-out forwards;
        }
        .brand-emblem {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #ffffff;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 24px -4px rgba(37, 99, 235, 0.4);
            margin-bottom: 1.5rem;
        }
        .btn-start {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0.9rem 1.5rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            transition: all 0.25s ease;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -4px rgba(37, 99, 235, 0.45);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="hero-box text-center">
    <div class="brand-emblem">
        <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
    </div>
    <span class="badge bg-primary bg-opacity-10 text-primary rounded-pill px-3 py-1 fw-semibold mb-2">PUNTO DE VENTA & GESTIÓN</span>
    <h2 class="fw-bold text-dark mb-2">Minimarket POS</h2>
    <p class="text-muted small mb-4 px-2">Plataforma integral para control de inventarios, catálogo en línea, facturación y administración de clientes.</p>

    <div class="d-grid">
        <a href="/login" class="btn btn-start text-decoration-none d-inline-flex align-items-center justify-content-center gap-2">
            <span>Ingresar al Sistema</span>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
            </svg>
        </a>
    </div>

    <div class="mt-4 pt-3 border-top d-flex justify-content-center gap-2">
        <span class="badge bg-light text-secondary border px-3 py-2 rounded-pill fw-normal">Spring Boot</span>
        <span class="badge bg-light text-secondary border px-3 py-2 rounded-pill fw-normal">MySQL</span>
    </div>
</div>

</body>
</html>
