<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<div class="container mt-4">
    <h3>Productos - Comprar</h3>
    <a href="/logout" class="btn btn-secondary mb-3">Salir</a>
    <div th:if="${param.pagado}" class="alert alert-success">Pago realizado, gracias!</div>
    <div class="row">
        <div class="col-md-8">
            <table class="table table-bordered">
                <tr><th>Producto</th><th>Precio</th><th>Stock</th><th></th></tr>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.precio}"></td>
                    <td th:text="${p.stock}"></td>
                    <td><a th:href="@{/usuario/comprar/{id}(id=${p.id_producto})}" class="btn btn-primary btn-sm">Comprar</a></td>
                </tr>
            </table>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <h5>Mi carrito</h5>
                <ul class="list-group">
                    <li class="list-group-item" th:each="c, stat : ${carrito}">
                        <span th:text="${c.nombre}"></span> - $<span th:text="${c.precio}"></span>
                        <a th:href="@{/usuario/quitar/{i}(i=${stat.index})}" class="btn btn-danger btn-sm float-end">X</a>
                    </li>
                </ul>
                <h5 class="mt-3">Total: $<span th:text="${total}"></span></h5>
                <a href="/usuario/pagar" class="btn btn-success w-100 mt-2">Pagar</a>
                <p class="text-muted small">Si no quieres pagar, quita con la X o solo sal sin pagar.</p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
