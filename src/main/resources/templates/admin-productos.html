<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Admin Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body>
<div class="container mt-4">
    <h3>Catálogo Productos - Admin</h3>
    <a href="/admin" class="btn btn-secondary mb-3">Volver</a>
    <form th:action="@{/admin/productos/agregar}" th:object="${nuevo}" method="post" class="card p-3 mb-3">
        <h5>Agregar producto</h5>
        <input th:field="*{nombre}" placeholder="Nombre" class="form-control mb-2" required>
        <input th:field="*{precio}" placeholder="Precio" type="number" step="0.01" class="form-control mb-2" required>
        <input th:field="*{stock}" placeholder="Stock" type="number" class="form-control mb-2">
        <button class="btn btn-success">Agregar</button>
    </form>
    <table class="table table-bordered">
        <tr><th>Nombre</th><th>Precio</th><th>Cambiar Precio</th><th>Acción</th></tr>
        <tr th:each="p : ${productos}">
            <td th:text="${p.nombre}"></td>
            <td th:text="${p.precio}"></td>
            <td>
                <form th:action="@{/admin/productos/precio/{id}(id=${p.id_producto})}" method="post" class="d-flex">
                    <input name="precio" type="number" step="0.01" th:value="${p.precio}" class="form-control form-control-sm">
                    <button class="btn btn-warning btn-sm ms-2">Subir/ Cambiar</button>
                </form>
            </td>
            <td><a th:href="@{/admin/productos/eliminar/{id}(id=${p.id_producto})}" class="btn btn-danger btn-sm">Quitar</a></td>
        </tr>
    </table>
</div>
</body>
</html>
