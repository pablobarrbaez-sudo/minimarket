<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-page { animation: fadeSlideUp 0.35s ease-out forwards; }
        .navbar-admin { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15); padding: 0.85rem 0; }
        .card-modern { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04); }
        .form-control-modern, .form-select-modern { background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.95rem; transition: all 0.2s ease; }
        .form-control-modern:focus, .form-select-modern:focus { background-color: #ffffff; border-color: #059669; box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.12); }
        .table-modern thead th { background-color: #f8fafc; color: #475569; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #e2e8f0; padding: 0.85rem 1rem; }
        .table-modern tbody td { padding: 0.9rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .table-modern tbody tr:hover { background-color: #f8fafc; }
        .btn-pill-action { border-radius: 999px; font-weight: 600; font-size: 0.82rem; padding: 0.35rem 0.9rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-admin sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/menu">Minimarket Admin</a>
        <div class="d-flex gap-2">
            <a href="/admin/menu" class="btn btn-outline-light btn-sm rounded-pill px-3">Menú Principal</a>
            <a href="/login" class="btn btn-danger btn-sm rounded-pill px-3">Salir</a>
        </div>
    </div>
</nav>

<div class="container py-4 mb-5 animate-page">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
            <h3 class="fw-bold text-dark mb-1">Inventario de Productos</h3>
            <p class="text-muted small mb-0">Administración de precios, catálogo y existencias en almacén</p>
        </div>
        <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill fw-semibold"
              th:text="${#lists.size(productos)} + ' productos'"></span>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card-modern p-4">
                <h5 class="fw-bold mb-3" th:text="${producto != null && producto.id_producto != null ? 'Editar Producto #' + producto.id_producto : 'Registrar Producto'}"></h5>

                <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post">
                    <input type="hidden" name="id_producto" th:field="*{id_producto}">

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Nombre del Producto</label>
                        <input type="text" name="nombre" th:field="*{nombre}" class="form-control form-control-modern" placeholder="Nombre del producto" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Marca</label>
                        <input type="text" name="marca" th:field="*{marca}" class="form-control form-control-modern" placeholder="Marca" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Categoría</label>
                        <select name="categoria" th:field="*{categoria}" class="form-select form-select-modern" required>
                            <option value="" disabled selected>Selecciona una categoría</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.id_categoria}"
                                    th:text="${cat.nombre}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Precio de Venta ($)</label>
                        <input type="number" step="0.01" name="precio" th:field="*{precio}" class="form-control form-control-modern" placeholder="Precio" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Stock Disponible</label>
                        <input type="number" name="stock" th:field="*{stock}" class="form-control form-control-modern" placeholder="Stock disponible" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success fw-bold py-2 rounded-3">Guardar Producto</button>
                        <a th:if="${producto != null && producto.id_producto != null}" href="/admin/productos" class="btn btn-light btn-sm text-muted">Cancelar edición</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card-modern p-4">
                <h5 class="fw-bold mb-3">Catálogo en Existencia</h5>
                <div class="table-responsive">
                    <table class="table table-modern align-middle mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Marca</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${productos}">
                            <td class="text-muted fw-semibold" th:text="'#' + ${p.id_producto}"></td>
                            <td class="fw-bold text-dark" th:text="${p.nombre}"></td>
                            <td class="text-secondary small fw-semibold" th:text="${p.marca != null ? p.marca : '—'}"></td>
                            <td>
                                    <span class="badge bg-warning bg-opacity-10 text-dark border border-warning-subtle fw-semibold px-2 py-1"
                                          th:text="${p.categoria != null ? p.categoria.nombre : 'Sin categoría'}"></span>
                            </td>
                            <td class="text-success fw-bold" th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 2)}"></td>
                            <td>
                                    <span class="badge rounded-pill px-3 py-1"
                                          th:classappend="${p.stock != null && p.stock > 5 ? 'bg-success bg-opacity-10 text-success' : 'bg-warning bg-opacity-10 text-dark'}"
                                          th:text="${p.stock} + ' uds.'"></span>
                            </td>
                            <td class="text-end text-nowrap">
                                <a th:href="@{/admin/productos/editar/{id}(id=${p.id_producto})}" class="btn btn-outline-warning btn-pill-action me-1">Editar</a>
                                <a th:href="@{/admin/productos/eliminar/{id}(id=${p.id_producto})}" class="btn btn-outline-danger btn-pill-action">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="7" class="text-center text-muted py-4">No hay productos registrados en la base de datos.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
