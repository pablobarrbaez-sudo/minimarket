<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-page { animation: fadeSlideUp 0.35s ease-out forwards; }
        .navbar-admin { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15); padding: 0.85rem 0; }
        .card-modern { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04); }
        .form-control-modern, .form-select-modern { background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.95rem; transition: all 0.2s ease; }
        .form-control-modern:focus, .form-select-modern:focus { background-color: #ffffff; border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
        .table-modern thead th { background-color: #f8fafc; color: #475569; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #e2e8f0; padding: 0.85rem 1rem; }
        .table-modern tbody td { padding: 0.9rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .table-modern tbody tr:hover { background-color: #f8fafc; }
        .btn-pill-action { border-radius: 999px; font-weight: 600; font-size: 0.82rem; padding: 0.35rem 0.9rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-admin sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/menu">Minimarket Admin</a>
        <div class="d-flex gap-2">
            <a href="/admin/menu" class="btn btn-outline-light btn-sm rounded-pill px-3">Menú Principal</a>
            <a href="/login" class="btn btn-danger btn-sm rounded-pill px-3">Salir</a>
        </div>
    </div>
</nav>

<div class="container py-4 mb-5 animate-page">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
            <h3 class="fw-bold text-dark mb-1">Gestión de Usuarios</h3>
            <p class="text-muted small mb-0">Control de credenciales y niveles de acceso al sistema</p>
        </div>
        <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill fw-semibold"
              th:text="${#lists.size(usuarios)} + ' cuentas'"></span>
    </div>

    <div th:if="${error}" class="alert alert-danger rounded-3 shadow-sm mb-4" role="alert" th:text="${error}"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card-modern p-4">
                <h5 class="fw-bold mb-3" th:text="${usuario != null && usuario.id_usuario != null ? 'Editar Usuario #' + usuario.id_usuario : 'Nuevo Usuario'}"></h5>

                <form th:action="@{/admin/usuarios/guardar}" method="post">
                    <input type="hidden" name="id_usuario" th:value="${usuario != null ? usuario.id_usuario : ''}">

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Nombre Completo</label>
                        <input type="text" name="nombre" maxlength="30" th:value="${usuario != null ? usuario.nombre : ''}" class="form-control form-control-modern" placeholder="Nombre completo" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Usuario de Acceso (Login)</label>
                        <input type="text" name="usuario" maxlength="20" th:value="${usuario != null ? usuario.usuario : ''}" class="form-control form-control-modern" placeholder="Usuario de acceso" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Contraseña</label>
                        <input type="password" name="password" maxlength="20" th:value="${usuario != null ? usuario.password : ''}" class="form-control form-control-modern" placeholder="Contraseña" th:required="${usuario == null || usuario.id_usuario == null}">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Rol Asignado</label>
                        <select name="rol" class="form-select form-select-modern">
                            <option value="ADMIN" th:selected="${usuario != null && usuario.rol == 'ADMIN'}">Administrador (ADMIN)</option>
                            <option value="USUARIO" th:selected="${usuario != null && usuario.rol == 'USUARIO'}">Cliente / Usuario (USUARIO)</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary fw-bold py-2 rounded-3">Guardar Usuario</button>
                        <a th:if="${usuario != null && usuario.id_usuario != null}" href="/admin/usuarios" class="btn btn-light btn-sm text-muted">Cancelar edición</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card-modern p-4">
                <h5 class="fw-bold mb-3">Cuentas Registradas</h5>
                <div class="table-responsive">
                    <table class="table table-modern align-middle mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Rol</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${usuarios}">
                            <td class="text-muted fw-semibold" th:text="'#' + ${u.id_usuario}"></td>
                            <td class="fw-bold text-dark" th:text="${u.nombre}"></td>
                            <td class="text-secondary small" th:text="${u.usuario}"></td>
                            <td>
                                    <span class="badge rounded-pill px-3 py-1"
                                          th:classappend="${u.rol == 'ADMIN' ? 'bg-primary bg-opacity-10 text-primary border border-primary-subtle' : 'bg-secondary bg-opacity-10 text-secondary border border-secondary-subtle'}"
                                          th:text="${u.rol}"></span>
                            </td>
                            <td class="text-end text-nowrap">
                                <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id_usuario})}" class="btn btn-outline-warning btn-pill-action me-1">Editar</a>
                                <a th:href="@{/admin/usuarios/eliminar/{id}(id=${u.id_usuario})}" class="btn btn-outline-danger btn-pill-action">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(usuarios)}">
                            <td colspan="5" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
