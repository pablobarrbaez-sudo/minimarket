<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Minimarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-light">
<div class="card p-4 shadow" style="width:380px;">
    <h3 class="text-center">Minimarket</h3>

    <h5 class="mt-3">Administrador</h5>
    <form action="/login/admin" method="post">
        <input name="username" class="form-control mb-2" placeholder="Usuario admin">
        <input name="password" type="password" class="form-control mb-2" placeholder="Contraseña">
        <button class="btn btn-dark w-100">Entrar Admin</button>
    </form>

    <hr>
    <h5>Usuario</h5>
    <form action="/login/usuario" method="post">
        <input name="nombre" class="form-control mb-2" placeholder="Nombre">
        <button class="btn btn-primary w-100">Entrar Usuario</button>
    </form>

    <div th:if="${param.error}" class="alert alert-danger mt-3">Datos incorrectos</div>
</div>
</body>
</html>
