<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Minimarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            margin: 0;
        }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card {
            background: #ffffff;
            border-radius: 22px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.08);
            padding: 2.75rem 2.25rem;
            max-width: 420px;
            width: 100%;
            animation: fadeSlideUp 0.35s ease-out forwards;
        }
        .form-control-modern {
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-control-modern:focus {
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .btn-login {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px -4px rgba(37, 99, 235, 0.4);
            color: white;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-4 p-3 mb-3">
            <svg width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
        </div>
        <h3 class="fw-bold text-dark mb-1">Bienvenido de nuevo</h3>
        <p class="text-muted small mb-0">Ingresa tus credenciales para acceder al portal</p>
    </div>

    <form action="/login" method="post">
        <div class="mb-3">
            <label class="form-label text-secondary fw-semibold small">Usuario</label>
            <input type="text" name="usuario" class="form-control form-control-modern" placeholder="Usuario" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-secondary fw-semibold small">Contraseña</label>
            <input type="password" name="password" class="form-control form-control-modern" placeholder="Contraseña">
            <div class="form-text small text-muted mt-1">Si ingresas como cliente, puedes dejar este campo vacío.</div>
        </div>
        <button type="submit" class="btn btn-login w-100 mb-2">Continuar al Sistema</button>
    </form>

    <div th:if="${error}" class="alert alert-danger text-center small p-2 mt-3 mb-0 rounded-3" role="alert" th:text="${error}"></div>

    <div class="text-center mt-4 pt-3 border-top">
        <a href="/" class="text-decoration-none text-muted small">&larr; Volver al inicio</a>
    </div>
</div>

</body>
</html>
