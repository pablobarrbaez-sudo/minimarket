<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Ventas - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-page { animation: fadeSlideUp 0.35s ease-out forwards; }
        .navbar-admin { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15); padding: 0.85rem 0; }
        .card-modern { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04); }
        .table-modern thead th { background-color: #f8fafc; color: #475569; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #e2e8f0; padding: 0.75rem 1rem; }
        .table-modern tbody td { padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .btn-pill-action { border-radius: 999px; font-weight: 600; font-size: 0.82rem; padding: 0.35rem 0.9rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-admin sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/menu">Minimarket Admin</a>
        <div class="d-flex gap-2">
            <a href="/admin/menu" class="btn btn-outline-light btn-sm rounded-pill px-3">Menú Principal</a>
            <a href="/login" class="btn btn-danger btn-sm rounded-pill px-3">Salir</a>
        </div>
    </div>
</nav>

<div class="container py-4 mb-5 animate-page">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
            <h3 class="fw-bold text-dark mb-1">Historial de Tickets y Ventas</h3>
            <p class="text-muted small mb-0">Haz clic sobre cualquier ticket para desplegar sus productos</p>
        </div>
        <span class="badge bg-danger bg-opacity-10 text-danger border border-danger-subtle px-3 py-2 rounded-pill fw-semibold"
              th:text="${#lists.size(ventas)} + ' tickets cobrados'"></span>
    </div>

    <div class="card-modern p-4">
        <div class="accordion" id="accordionVentas">
            <div class="accordion-item mb-3 border rounded-4 overflow-hidden shadow-sm" th:each="v : ${ventas}">
                <h2 class="accordion-header" th:id="'heading' + ${v.id_venta}">
                    <button class="accordion-button collapsed py-3 bg-white" type="button" data-bs-toggle="collapse"
                            th:data-bs-target="'#collapse' + ${v.id_venta}">
                        <div class="d-flex justify-content-between align-items-center w-100 me-3">
                            <span class="fw-bold text-primary" th:text="'Ticket #' + ${v.id_venta}"></span>
                            <span class="badge bg-success fs-6 rounded-pill px-3 py-2"
                                  th:text="'Total: $' + ${#numbers.formatDecimal(v.total, 1, 2)}"></span>
                        </div>
                    </button>
                </h2>
                <div th:id="'collapse' + ${v.id_venta}" class="accordion-collapse collapse" data-bs-parent="#accordionVentas">
                    <div class="accordion-body bg-light">
                        <h6 class="fw-bold text-secondary small text-uppercase mb-3">Detalle de artículos vendidos</h6>
                        <div class="table-responsive">
                            <table class="table table-modern bg-white rounded-3 overflow-hidden mb-3">
                                <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio Unitario</th>
                                    <th>Subtotal</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item : ${v.items}">
                                    <td class="fw-semibold text-dark" th:text="${item.nombreProducto}"></td>
                                    <td><span class="badge bg-secondary rounded-pill px-2" th:text="${item.cantidad}"></span></td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(item.precio_unitario, 1, 2)}"></td>
                                    <td class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="text-end">
                            <a th:href="@{/admin/ventas/eliminar/{id}(id=${v.id_venta})}"
                               class="btn btn-outline-danger btn-pill-action">Eliminar Ticket</a>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(ventas)}" class="text-center text-muted py-5">
                No hay ventas registradas en el sistema aún.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
