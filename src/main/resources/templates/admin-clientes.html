<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .animate-page { animation: fadeSlideUp 0.35s ease-out forwards; }
        .navbar-admin { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15); padding: 0.85rem 0; }
        .card-modern { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04); }
        .form-control-modern { background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 10px; padding: 0.6rem 0.9rem; font-size: 0.95rem; transition: all 0.2s ease; }
        .form-control-modern:focus { background-color: #ffffff; border-color: #0ea5e9; box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15); }
        .table-modern thead th { background-color: #f8fafc; color: #475569; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid #e2e8f0; padding: 0.85rem 1rem; }
        .table-modern tbody td { padding: 0.9rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .table-modern tbody tr:hover { background-color: #f8fafc; }
        .btn-pill-action { border-radius: 999px; font-weight: 600; font-size: 0.82rem; padding: 0.35rem 0.9rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-admin sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/menu">Minimarket Admin</a>
        <div class="d-flex gap-2">
            <a href="/admin/menu" class="btn btn-outline-light btn-sm rounded-pill px-3">Menú Principal</a>
            <a href="/login" class="btn btn-danger btn-sm rounded-pill px-3">Salir</a>
        </div>
    </div>
</nav>

<div class="container py-4 mb-5 animate-page">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
            <h3 class="fw-bold text-dark mb-1">Directorio de Clientes</h3>
            <p class="text-muted small mb-0">Registro y administración de compradores frecuentes</p>
        </div>
        <span class="badge bg-info bg-opacity-10 text-info border border-info-subtle px-3 py-2 rounded-pill fw-semibold"
              th:text="${#lists.size(clientes)} + ' clientes'"></span>
    </div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card-modern p-4">
                <h5 class="fw-bold mb-3" th:text="${cliente != null && cliente.id_cliente != null ? 'Editar Cliente #' + cliente.id_cliente : 'Registrar Cliente'}"></h5>

                <form th:action="@{/admin/clientes/guardar}" method="post">
                    <input type="hidden" name="id_cliente" th:value="${cliente != null ? cliente.id_cliente : ''}">

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">Nombre Completo</label>
                        <input type="text" name="nombre" th:value="${cliente != null ? cliente.nombre : ''}" class="form-control form-control-modern" placeholder="Nombre completo" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-semibold">DNI / Identificación</label>
                        <input type="text" name="dni" th:value="${cliente != null ? cliente.dni : ''}" class="form-control form-control-modern" placeholder="DNI / Identificación">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-secondary small fw-semibold">Teléfono</label>
                        <input type="text" name="telefono" th:value="${cliente != null ? cliente.telefono : ''}" class="form-control form-control-modern" placeholder="Teléfono">
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-info fw-bold py-2 rounded-3 text-white">Guardar Cliente</button>
                        <a th:if="${cliente != null && cliente.id_cliente != null}" href="/admin/clientes" class="btn btn-light btn-sm text-muted">Cancelar edición</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card-modern p-4">
                <h5 class="fw-bold mb-3">Clientes Registrados</h5>
                <div class="table-responsive">
                    <table class="table table-modern align-middle mb-0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>DNI</th>
                            <th>Teléfono</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cl : ${clientes}">
                            <td class="text-muted fw-semibold" th:text="'#' + ${cl.id_cliente}"></td>
                            <td class="fw-bold text-dark" th:text="${cl.nombre}"></td>
                            <td class="text-secondary small" th:text="${cl.dni != null && !#strings.isEmpty(cl.dni) ? cl.dni : '—'}"></td>
                            <td class="text-secondary small" th:text="${cl.telefono != null && !#strings.isEmpty(cl.telefono) ? cl.telefono : '—'}"></td>
                            <td class="text-end text-nowrap">
                                <a th:href="@{/admin/clientes/editar/{id}(id=${cl.id_cliente})}" class="btn btn-outline-warning btn-pill-action me-1">Editar</a>
                                <a th:href="@{/admin/clientes/eliminar/{id}(id=${cl.id_cliente})}" class="btn btn-outline-danger btn-pill-action">Eliminar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(clientes)}">
                            <td colspan="5" class="text-center text-muted py-4">No hay clientes registrados en la base de datos.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
